media:
  - name: product_images
    label: Product Images
    input: media/images
    output: /media/images
    rename: safe
    categories: [image]

content:
  - name: site
    label: Site Content
    type: file
    path: data/site.json
    format: json
    fields:
      - name: brand_name
        label: Brand Name
        type: string
        required: true
      - name: brand_subtitle
        label: Brand Subtitle
        type: string
      - name: business_name
        label: Full Business Name
        type: string
        required: true
      - name: meta_description
        label: Search Description
        type: text
        description: Short description used by search engines and link previews.

      - name: hero_eyebrow
        label: Homepage Small Heading
        type: string
      - name: hero_title
        label: Homepage Main Heading
        type: string
        required: true
      - name: hero_text
        label: Homepage Intro
        type: text
      - name: hero_primary_label
        label: Main Button Text
        type: string
      - name: hero_primary_url
        label: Main Button Link
        type: string
        description: Use #shop for the product section or paste a full https:// link.
      - name: hero_secondary_label
        label: Second Button Text
        type: string
      - name: hero_secondary_url
        label: Second Button Link
        type: string
        description: Use #custom or paste a full https:// link.
      - name: trust_points
        label: Homepage Highlights
        type: string
        list:
          min: 1
          max: 4

      - name: shop_eyebrow
        label: Products Small Heading
        type: string
      - name: shop_heading
        label: Products Heading
        type: string
      - name: shop_intro
        label: Products Intro
        type: text

      - name: about_eyebrow
        label: About Small Heading
        type: string
      - name: about_heading
        label: About Heading
        type: string
      - name: about_paragraph_1
        label: About Paragraph 1
        type: text
      - name: about_paragraph_2
        label: About Paragraph 2
        type: text
      - name: about_quote
        label: About Quote
        type: text

      - name: custom_eyebrow
        label: Custom Orders Small Heading
        type: string
      - name: custom_heading
        label: Custom Orders Heading
        type: string
      - name: custom_text
        label: Custom Orders Text
        type: text
      - name: custom_button_label
        label: Custom Orders Button Text
        type: string
      - name: custom_button_url
        label: Custom Orders Button Link
        type: string
      - name: custom_steps
        label: Custom Order Steps
        type: object
        list:
          min: 1
          max: 5
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Step Title
            type: string
          - name: text
            label: Step Description
            type: text

      - name: events_eyebrow
        label: Events Small Heading
        type: string
      - name: events_heading
        label: Events Heading
        type: string
      - name: events_intro
        label: Events Intro
        type: text

      - name: contact_eyebrow
        label: Contact Small Heading
        type: string
      - name: contact_heading
        label: Contact Heading
        type: string
      - name: contact_text
        label: Contact Intro
        type: text
      - name: contact_label
        label: Contact Box Label
        type: string
      - name: contact_link_text
        label: Contact Link Text
        type: string
        description: "Example: Email Knollwood or Message us on Facebook."
      - name: contact_url
        label: Contact Link
        type: string
        description: "Example: mailto:you@example.com or a full https:// social link."
      - name: contact_note
        label: Contact Note
        type: text
      - name: shop_url
        label: Online Shop Link
        type: string
        description: Optional Square, Etsy, or other shop URL.
      - name: instagram_url
        label: Instagram Link
        type: string
      - name: facebook_url
        label: Facebook Link
        type: string

      - name: faq_eyebrow
        label: FAQ Small Heading
        type: string
      - name: faq_heading
        label: FAQ Heading
        type: string

  - name: products
    label: Products
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: title
        label: Product Name
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Sewn Goods
            - Related Crafts
            - Seasonal
            - Mugs
            - Ornaments
            - Other
      - name: description
        label: Description
        type: text
      - name: price
        label: Price
        type: number
        description: Enter 0 if you do not want a price displayed.
      - name: image
        label: Product Photo
        type: image
        options:
          media: product_images
          rename: safe
      - name: button_label
        label: Button Text
        type: string
        description: "Example: Buy Now, View Product, or Ask What's Available."
      - name: button_url
        label: Button Link
        type: string
        description: Paste a Square checkout/product link, other shop link, or use #contact.
      - name: available
        label: Available
        type: boolean
      - name: show
        label: Show on Website
        type: boolean

  - name: events
    label: Craft Fairs & Events
    type: file
    path: data/events.json
    format: json
    list: true
    fields:
      - name: label
        label: Small Label
        type: string
        description: "Example: NEXT EVENT or OCTOBER."
      - name: name
        label: Event Name
        type: string
        required: true
      - name: date_and_time
        label: Date and Time
        type: string
        description: "Example: October 18, 2026 • 10 AM–4 PM"
      - name: location
        label: Location
        type: string
        description: "Example: Town Hall, Tewksbury, MA"
      - name: description
        label: Description
        type: text
      - name: button_label
        label: Button Text
        type: string
      - name: button_url
        label: Button Link
        type: string
      - name: show
        label: Show on Website
        type: boolean

  - name: faqs
    label: FAQs
    type: file
    path: data/faqs.json
    format: json
    list: true
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: text
        required: true
      - name: show
        label: Show on Website
        type: boolean

settings:
  commit:
    templates:
      update: "Update {name} via Pages CMS"
      create: "Add {name} via Pages CMS"
      delete: "Remove {name} via Pages CMS"
